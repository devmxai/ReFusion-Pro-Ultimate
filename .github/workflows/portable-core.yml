name: Portable Core

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 15 arm64 / Apple Clang
            runner: macos-15
            preset: macos-core
            python: python3
          - name: macOS 15 arm64 / Apple Clang / ASan+UBSan
            runner: macos-15
            preset: macos-core-sanitized
            python: python3
          - name: Windows Server 2025 x64 / MSVC
            runner: windows-2025
            preset: windows-core
            python: python

    steps:
      - name: Check out the immutable source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify the build toolchain
        run: ${{ matrix.python }} tools/bootstrap.py doctor

      - name: Verify normative documentation
        run: ${{ matrix.python }} tools/rfdev.py docs-doctor

      - name: Verify architectural boundaries
        run: ${{ matrix.python }} tools/rfdev.py architecture-check

      - name: Configure, build, and test portable Core on macOS
        if: runner.os == 'macOS'
        run: cmake --workflow --preset ${{ matrix.preset }}

      - name: Configure, build, and test portable Core on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) {
            throw "A supported MSVC C++ toolchain was not found."
          }
          Import-Module "$installation\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $installation -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          cmake --workflow --preset ${{ matrix.preset }}
